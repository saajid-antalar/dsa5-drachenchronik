name: Package Foundry release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build installable module archive
        run: |
          mkdir -p package
          cp module.json package/module.json
          cp -R scripts package/scripts
          (cd package && zip -qr ../dsa5-drachenchronik.zip .)

      - name: Attach archive to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dsa5-drachenchronik.zip --clobber
